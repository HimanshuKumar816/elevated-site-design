<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CampusFind — Smart Campus Lost &amp; Found</title>
  <desc id="desc">A calm green and navy campus lost-and-found brand image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102d35"/><stop offset="1" stop-color="#163b45"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#91edc2"/><stop offset="1" stop-color="#59c79b"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="36" fill="url(#grid)"/>
  <circle cx="1010" cy="130" r="220" fill="#79e3b1" opacity=".08"/>
  <circle cx="1080" cy="510" r="210" fill="#79e3b1" opacity=".08"/>
