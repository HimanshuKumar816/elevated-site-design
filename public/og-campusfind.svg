  <text x="104" y="334" fill="#9af0c4" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="4">SMART CAMPUS LOST &amp; FOUND</text>
  <text x="104" y="405" fill="#e1e9ea" font-family="Arial, Helvetica, sans-serif" font-size="31">Report it. Find it. Bring it home.</text>
