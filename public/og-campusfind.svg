    <path d="M43 16c-14 0-25 11-25 25 0 18 25 44 25 44s25-26 25-44c0-14-11-25-25-25zm0 34a9 9 0 1 1 0-18 9 9 0 0 1 0 18z" fill="#102d35"/>
