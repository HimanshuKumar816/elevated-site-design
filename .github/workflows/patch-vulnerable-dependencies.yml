name: Patch vulnerable dependencies

on:
  push:
    branches: [security/seo-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'automated dependency security patch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply only available non-vulnerable dependency updates
        run: bun audit fix
      - name: Commit patch-level dependency updates to this review branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo 'No automatic safe-range fixes are available.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'automated dependency security patch'
          git push origin "HEAD:${BRANCH_NAME}"
