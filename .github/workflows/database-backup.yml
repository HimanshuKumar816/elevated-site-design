name: Scheduled database backup

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check backup connection secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Add the SUPABASE_DB_URL GitHub Actions secret before running database backups."
            exit 1
          fi

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Create encrypted-transport database dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          mkdir -p backups
          pg_dump --format=custom --no-owner --no-acl --verbose --file="backups/campusfind-$(date -u +%Y%m%dT%H%M%SZ).dump" "$SUPABASE_DB_URL"

      - name: Store backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusfind-database-backup-${{ github.run_id }}
          path: backups/*.dump
          if-no-files-found: error
          retention-days: 30
