name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate macOS backup script syntax
        run: bash -n scripts/backup_campusfind.sh
      - name: Lint, typecheck, tests and production build
        run: bun run build
